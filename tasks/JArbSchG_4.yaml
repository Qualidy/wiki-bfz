title: Arbeitszeit und Schichtzeit nach § 4 JArbSchG
question: |
  Beantworte die folgenden Fragen zu § 4 JArbSchG. Begründe deine Antworten jeweils kurz.

  **1.** Eine 17-jährige Auszubildende beginnt um 7:30 Uhr mit der Arbeit. Sie macht von 9:30 bis 9:45 Uhr eine Pause, von 12:00 bis 12:30 Uhr Mittagspause und beendet ihre Arbeit um 16:15 Uhr.

  Berechne:

  - die tägliche Arbeitszeit,
  - die Schichtzeit,
  - und erkläre, weshalb sich beide Werte unterscheiden.

  **2.** Ein 17-jähriger Beschäftigter arbeitet unter Tage in einem Bergwerk. Er betritt um 6:40 Uhr den Förderkorb zur Einfahrt. Unter Tage hat er insgesamt 45 Minuten Pause. Um 14:50 Uhr verlässt er nach der Ausfahrt den Förderkorb.

  Sein Arbeitgeber rechnet:

  „Von den 8 Stunden und 10 Minuten ziehen wir die 45 Minuten Pause ab. Damit ergeben sich 7 Stunden und 25 Minuten Arbeitszeit.“

  Ist diese Berechnung nach § 4 JArbSchG richtig? Berechne die maßgebliche Arbeitszeit und begründe deine Antwort.

  **3. Weiterführend:** Eine 16-jährige Auszubildende arbeitet normalerweise von Montag bis Freitag jeweils 8 Stunden. In einer Woche ist der Donnerstag ein gesetzlicher Feiertag. Sie arbeitet deshalb tatsächlich nur:

  - Montag: 8 Stunden
  - Dienstag: 8 Stunden
  - Mittwoch: 8 Stunden
  - Donnerstag: Feiertag
  - Freitag: 8 Stunden

  Der Arbeitgeber sagt:

  „Du hast diese Woche nur 32 Stunden gearbeitet. Die fehlenden 8 Stunden kannst du deshalb am Samstag nachholen.“

  Wie viele Stunden sind nach § 4 für die wöchentliche Arbeitszeit anzusetzen? Kannst du allein mit § 4 auch entscheiden, ob sie stattdessen am Samstag arbeiten darf?

  **4. Weiterführend:** Ein 17-Jähriger hat zwei Arbeitsverhältnisse.

  Am Montag arbeitet er von 6:00 bis 12:30 Uhr bei Arbeitgeber A. Davon sind 30 Minuten Pause.

  Anschließend arbeitet er von 14:00 bis 20:30 Uhr bei Arbeitgeber B. Auch dort macht er 30 Minuten Pause.

  Arbeitgeber A sagt:

  „Bei uns arbeitet er nur 6 Stunden.“

  Arbeitgeber B sagt:

  „Bei uns arbeitet er ebenfalls nur 6 Stunden. Was er beim anderen Arbeitgeber macht, spielt für uns keine Rolle.“

  Beantworte folgende Fragen:

  - Wie hoch ist die gesamte Arbeitszeit des Jugendlichen?
  - Wie sind die beiden Beschäftigungen nach § 4 zu behandeln?
  - Kannst du allein mit § 4 entscheiden, ob die gesamte Beschäftigung an diesem Tag zulässig ist?

  **5. Weiterführend:** Eine 16-Jährige arbeitet regelmäßig bei zwei Arbeitgebern.

  Bei Arbeitgeber A arbeitet sie Montag bis Donnerstag.

  Bei Arbeitgeber B arbeitet sie zusätzlich am Freitag und Samstag.

  Arbeitgeber B argumentiert:

  „Bei uns arbeitet sie nur an zwei Tagen pro Woche. Wie viele Tage sie bei Arbeitgeber A arbeitet, müssen wir nicht berücksichtigen.“

  Beurteile die Aussage zunächst anhand von § 4 JArbSchG.

  Entscheide anschließend, ob du allein mit § 4 feststellen kannst, ob sechs Arbeitstage pro Woche zulässig sind.

solution: |
  **1. Arbeitszeit: 8 Stunden; Schichtzeit: 8 Stunden und 45 Minuten**

  Von 7:30 Uhr bis 16:15 Uhr liegen insgesamt 8 Stunden und 45 Minuten.

  Die Pausen betragen insgesamt 45 Minuten.

  Nach § 4 Abs. 1 JArbSchG werden Ruhepausen bei der täglichen Arbeitszeit nicht mitgerechnet.

  Daher gilt:

  8 Stunden 45 Minuten − 45 Minuten Pause = **8 Stunden Arbeitszeit**.

  Die Schichtzeit umfasst nach § 4 Abs. 2 dagegen die Arbeitszeit einschließlich der Ruhepausen.

  Die Schichtzeit beträgt deshalb **8 Stunden und 45 Minuten**.

  **2. Die Berechnung des Arbeitgebers ist falsch.**

  Für den Bergbau unter Tage enthält § 4 Abs. 3 JArbSchG eine Sonderregel: Dort gilt die **Schichtzeit als Arbeitszeit**.

  Die maßgebliche Zeit beginnt hier mit dem Betreten des Förderkorbs bei der Einfahrt und endet mit dem Verlassen des Förderkorbs bei der Ausfahrt.

  Von 6:40 Uhr bis 14:50 Uhr ergeben sich daher **8 Stunden und 10 Minuten Arbeitszeit**.

  Die 45 Minuten Pause werden in diesem besonderen Fall nicht von der Arbeitszeit abgezogen.

  **3. Weiterführend – 40 Stunden sind anzurechnen.**

  Tatsächlich gearbeitet wurden 32 Stunden.

  Nach § 4 Abs. 4 JArbSchG wird jedoch die Arbeitszeit, die an einem Werktag wegen eines gesetzlichen Feiertags ausfällt, auf die wöchentliche Arbeitszeit angerechnet.

  Damit gilt:

  32 Stunden tatsächlich gearbeitet + 8 Stunden Feiertag = **40 Stunden anzurechnende Wochenarbeitszeit**.

  Der Arbeitgeber kann also nicht argumentieren, dass aufgrund des Feiertags nur 32 Stunden für die Wochenarbeitszeit zählen.

  **Weiterführender Hinweis:** Ob und unter welchen Voraussetzungen die Jugendliche am Samstag beschäftigt werden darf, beantwortet § 4 allein nicht. Dafür müssen insbesondere die Vorschriften über die Arbeitszeit, die Fünf-Tage-Woche und die Samstagsruhe berücksichtigt werden.

  **4. Weiterführend – insgesamt 12 Stunden Arbeitszeit**

  Bei Arbeitgeber A:

  6:00 bis 12:30 Uhr = 6,5 Stunden Schichtzeit  
  − 30 Minuten Pause = **6 Stunden Arbeitszeit**.

  Bei Arbeitgeber B:

  14:00 bis 20:30 Uhr = 6,5 Stunden Schichtzeit  
  − 30 Minuten Pause = **6 Stunden Arbeitszeit**.

  Insgesamt ergeben sich **12 Stunden Arbeitszeit**.

  Nach § 4 Abs. 5 JArbSchG werden bei mehreren Arbeitgebern die Arbeitszeiten zusammengerechnet.

  Die beiden Arbeitgeber dürfen ihre Beschäftigungen deshalb nicht getrennt voneinander betrachten.

  **Weiterführender Hinweis:** § 4 sagt zunächst nur, dass die Zeiten zusammengerechnet werden. Ob 12 Stunden tägliche Arbeitszeit zulässig sind, muss anhand der Vorschriften über die höchstzulässige Arbeitszeit geprüft werden.

  **5. Weiterführend – die Aussage des Arbeitgebers ist falsch.**

  Nach § 4 Abs. 5 JArbSchG werden bei mehreren Arbeitgebern nicht nur die Arbeitszeiten, sondern auch die **Schichtzeiten und Arbeitstage zusammengerechnet**.

  Die Jugendliche arbeitet daher insgesamt an sechs Tagen:

  Montag, Dienstag, Mittwoch, Donnerstag, Freitag und Samstag.

  Arbeitgeber B darf also nicht ausschließlich seine eigenen beiden Arbeitstage betrachten.

  **Weiterführender Hinweis:** § 4 beantwortet noch nicht, ob sechs Arbeitstage pro Woche zulässig sind. Dafür muss zusätzlich die Vorschrift über die Fünf-Tage-Woche und gegebenenfalls die Samstagsruhe geprüft werden.

solution_video:
tip: |
  **Weiterführende Fragen**

  Bei einigen Aufgaben reicht § 4 JArbSchG allein nicht für eine abschließende Beurteilung.

  **Frage 3:** Zusätzlich relevant sind insbesondere:

  - § 8 JArbSchG – Dauer der Arbeitszeit
  - § 15 JArbSchG – Fünf-Tage-Woche
  - § 16 JArbSchG – Samstagsruhe

  **Frage 4:** Zusätzlich relevant ist insbesondere:

  - § 8 JArbSchG – Dauer der Arbeitszeit

  **Frage 5:** Zusätzlich relevant sind insbesondere:

  - § 15 JArbSchG – Fünf-Tage-Woche
  - § 16 JArbSchG – Samstagsruhe

  Merke für § 4:

  **Arbeitszeit** = Beschäftigungszeit ohne Pausen.

  **Schichtzeit** = Arbeitszeit + Pausen.

  **Woche** = Montag bis Sonntag.

  **Mehrere Arbeitgeber** = Arbeitszeiten, Schichtzeiten und Arbeitstage werden zusammengerechnet.