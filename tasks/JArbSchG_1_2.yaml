title: Ausnahmen vom Anwendungsbereich des JArbSchG
question: |
  Entscheide bei den folgenden Beispielen, ob das Jugendarbeitsschutzgesetz anwendbar ist oder ob eine Ausnahme nach § 1 Abs. 2 JArbSchG vorliegt.

  Begründe deine Entscheidung jeweils kurz.

  1. Ein 16-Jähriger hilft seinem Nachbarn einmalig und unentgeltlich dabei, einige Möbel in dessen Wohnung zu tragen.

  2. Eine 15-Jährige hilft gelegentlich ihren Eltern im gemeinsamen Familienhaushalt beim Putzen und Abwaschen.

  3. Ein 17-Jähriger übernimmt in einer Einrichtung der Jugendhilfe gelegentlich kleine Hilfsarbeiten im Rahmen einer dort durchgeführten pädagogischen Maßnahme.

  4. Eine 16-Jährige arbeitet jeden Samstag für drei Stunden gegen Bezahlung im Lebensmittelgeschäft ihrer Eltern.

  5. Ein 15-jähriger Schüler arbeitet an zwei Samstagen jeweils zwei Stunden gegen Bezahlung in einem Supermarkt.

solution: |
  **1. JArbSchG gilt nicht.**

  Es handelt sich um eine geringfügige und gelegentliche Hilfeleistung aus Gefälligkeit. Damit greift die Ausnahme nach § 1 Abs. 2 Nr. 1 Buchst. a JArbSchG.

  **2. JArbSchG gilt nicht.**

  Die Hilfe erfolgt im Familienhaushalt und beruht auf dem Familienverhältnis. Außerdem ist die Beschäftigung durch Personensorgeberechtigte im Familienhaushalt nach § 1 Abs. 2 Nr. 2 JArbSchG ausgenommen.

  **3. JArbSchG gilt nicht.**

  Gelegentliche geringfügige Hilfeleistungen in Einrichtungen der Jugendhilfe sind nach § 1 Abs. 2 Nr. 1 Buchst. c JArbSchG vom Anwendungsbereich ausgenommen.

  **4. JArbSchG gilt.**

  Die regelmäßige Beschäftigung in einem Lebensmittelgeschäft ist keine Beschäftigung im Familienhaushalt. Dass das Geschäft den Eltern gehört, reicht für die Ausnahme nach § 1 Abs. 2 Nr. 2 JArbSchG nicht aus.

  **5. JArbSchG gilt.**

  Der 15-Jährige wird als Arbeitnehmer in einem Supermarkt beschäftigt und fällt damit grundsätzlich unter § 1 Abs. 1 JArbSchG. Es handelt sich nicht um eine geringfügige gelegentliche Hilfeleistung nach § 1 Abs. 2.

solution_video:
tip: Die Frage „Gilt das JArbSchG?“ ist von der Frage „Ist die Beschäftigung erlaubt?“ zu unterscheiden. Das JArbSchG kann gelten und die konkrete Beschäftigung trotzdem aufgrund einer Ausnahme innerhalb des Gesetzes zulässig sein.
