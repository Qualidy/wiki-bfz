title: Kind oder Jugendlicher nach § 2 JArbSchG
question: |
  Beantworte die folgenden Fragen zu § 2 JArbSchG.

  **1.** Lea wird morgen 15 Jahre alt. Heute möchte sie einen Ferienjob beginnen. Ist sie heute nach dem JArbSchG ein Kind oder eine Jugendliche?

  **2.** Tim ist genau 15 Jahre alt und nicht mehr vollzeitschulpflichtig. Ist er nach dem JArbSchG ein Kind oder ein Jugendlicher?

  **3.** Paul ist 17 Jahre und 11 Monate alt. In zwei Wochen wird er 18 Jahre alt. Wie wird er heute nach dem JArbSchG eingeordnet?

  **4.** Mia ist 16 Jahre alt und noch vollzeitschulpflichtig. Ist sie nach § 2 JArbSchG ein Kind oder eine Jugendliche? Welche Vorschriften gelten für sie?

  **5.** Jonas und Leon sind beide 16 Jahre alt. Jonas ist noch vollzeitschulpflichtig, Leon nicht mehr. Gelten für beide dieselben Beschäftigungsvorschriften?

  **6.** Vier Personen möchten in einem Betrieb arbeiten:

  - Anna ist 14 Jahre alt.
  - Ben ist 15 Jahre alt.
  - Clara ist 17 Jahre alt.
  - David ist 18 Jahre alt.

  Welche Person ist weder Kind noch Jugendlicher im Sinne des JArbSchG?

  **7.** Richtig oder falsch?

  „Für jeden 16-Jährigen gelten automatisch die Vorschriften für Jugendliche und nicht mehr für Kinder.“

  **8.** Ein Arbeitgeber sagt:

  „Der Schüler ist schon 16 Jahre alt. Deshalb können die Vorschriften für Kinder auf keinen Fall mehr gelten.“

  Ist diese Aussage richtig?

  **9.** Ordne die folgenden Personen richtig ein:

  - 13 Jahre
  - 14 Jahre und 364 Tage
  - 15 Jahre
  - 17 Jahre
  - 18 Jahre

  Verwende die Kategorien „Kind“, „Jugendlicher“ und „weder Kind noch Jugendlicher“.

  **10.** Sophie ist 15 Jahre alt und noch vollzeitschulpflichtig. Welche Aussage ist richtig?

  **A:** Sophie ist nach dem JArbSchG ein Kind.

  **B:** Sophie ist Jugendliche und es gelten ausschließlich die Vorschriften für Jugendliche.

  **C:** Sophie ist Jugendliche, aber auf sie finden die für Kinder geltenden Vorschriften Anwendung.

  **D:** Das JArbSchG gilt für Sophie nicht.

solution: |
  **1. Kind**

  Lea ist noch nicht 15 Jahre alt. Nach § 2 Abs. 1 JArbSchG ist Kind, wer noch nicht 15 Jahre alt ist.

  **2. Jugendlicher**

  Tim ist 15, aber noch nicht 18 Jahre alt. Damit ist er nach § 2 Abs. 2 JArbSchG Jugendlicher.

  **3. Jugendlicher**

  Paul ist noch nicht 18 Jahre alt. Bis zum 18. Geburtstag gilt er nach § 2 Abs. 2 JArbSchG als Jugendlicher.

  **4. Jugendliche – aber es gelten die Vorschriften für Kinder**

  Mia ist mit 16 Jahren Jugendliche. Da sie aber noch vollzeitschulpflichtig ist, finden nach § 2 Abs. 3 JArbSchG auf sie die für Kinder geltenden Vorschriften Anwendung.

  **5. Nein**

  Beide sind Jugendliche. Für Jonas gelten wegen seiner Vollzeitschulpflicht jedoch die Vorschriften für Kinder. Für Leon gelten grundsätzlich die Vorschriften für Jugendliche.

  **6. David**

  Anna ist mit 14 Jahren ein Kind. Ben und Clara sind Jugendliche. David ist bereits 18 Jahre alt und damit weder Kind noch Jugendlicher im Sinne des § 2 JArbSchG.

  **7. Falsch**

  Ein 16-Jähriger ist zwar Jugendlicher. Ist er aber noch vollzeitschulpflichtig, gelten nach § 2 Abs. 3 JArbSchG die Vorschriften für Kinder.

  **8. Nein**

  Die Aussage ist falsch. Auch bei einem 16-Jährigen können die Vorschriften für Kinder gelten, wenn er noch der Vollzeitschulpflicht unterliegt.

  **9. Zuordnung**

  - 13 Jahre → Kind
  - 14 Jahre und 364 Tage → Kind
  - 15 Jahre → Jugendlicher
  - 17 Jahre → Jugendlicher
  - 18 Jahre → weder Kind noch Jugendlicher

  **10. C ist richtig**

  Sophie ist mit 15 Jahren Jugendliche. Wegen ihrer Vollzeitschulpflicht gelten für sie jedoch nach § 2 Abs. 3 JArbSchG die Vorschriften für Kinder.

solution_video:
tip: |
  Unter 15 = Kind, 15 bis unter 18 = Jugendlicher.

  Wichtig: Ein vollzeitschulpflichtiger Jugendlicher bleibt ein Jugendlicher, auf ihn finden aber die für Kinder geltenden Vorschriften Anwendung.