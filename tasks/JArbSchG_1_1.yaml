title: Zuordnung nach § 1 JArbSchG
question: |
  Ordne die folgenden Beispiele den vier Kategorien aus § 1 Abs. 1 JArbSchG zu.

  Verwende dabei folgende Kategorien:

  **A:** Berufsausbildung

  **B:** Arbeitnehmer oder Heimarbeiter

  **C:** Sonstige Dienstleistungen, die der Arbeitsleistung von Arbeitnehmern oder Heimarbeitern ähnlich sind

  **D:** Ein der Berufsausbildung ähnliches Ausbildungsverhältnis

  **E:** Keine der genannten Kategorien

    1. Ein 17-Jähriger absolviert eine Ausbildung zum Fachinformatiker für Systemintegration.

  2. Eine 16-Jährige arbeitet jeden Samstag gegen Bezahlung als Aushilfe in einem Supermarkt.

  3. Ein 17-Jähriger montiert zu Hause regelmäßig im Auftrag eines Unternehmens kleine Bauteile und erhält dafür eine Vergütung.

  4. Eine 16-Jährige hilft ihrem Nachbarn einmalig und unentgeltlich beim Rasenmähen.

  5. Ein 17-Jähriger absolviert ein längerfristiges betriebliches Praktikum, bei dem ihm nach einem festen Plan berufliche Fertigkeiten vermittelt werden.

  6. Eine 17-Jährige arbeitet regelmäßig gegen Vergütung für einen Betrieb. Sie ist formal keine Arbeitnehmerin, erbringt aber vergleichbare Arbeitsleistungen wie die dort beschäftigten Arbeitnehmer.

  7. Ein 16-Jähriger absolviert eine Ausbildung zum Verkäufer und hat mit seinem Ausbildungsbetrieb einen Berufsausbildungsvertrag geschlossen.

  8. Eine 17-Jährige verpackt zu Hause regelmäßig Waren für ein Unternehmen und wird nach der Menge der fertiggestellten Pakete bezahlt.

  9. Ein 15-Jähriger hilft gelegentlich seinen Eltern zu Hause beim Abwasch und Aufräumen seines Zimmers.

  10. Ein 18-Jähriger absolviert eine Ausbildung zum Kaufmann für Büromanagement.
solution: |
  **1. A – Berufsausbildung**

  Es handelt sich um eine reguläre Berufsausbildung in einem anerkannten Ausbildungsberuf.

  **2. B – Arbeitnehmer**

  Die Jugendliche arbeitet gegen Bezahlung für einen Arbeitgeber und ist damit als Arbeitnehmerin beschäftigt.

  **3. B – Heimarbeiter**

  Der Jugendliche arbeitet regelmäßig zu Hause im Auftrag eines Unternehmens und erhält dafür eine Vergütung.

  **4. E – Keine der Kategorien**

  Das einmalige und unentgeltliche Rasenmähen ist lediglich eine gelegentliche Gefälligkeit.

  **5. D – Der Berufsausbildung ähnliches Ausbildungsverhältnis**

  Es besteht keine klassische Berufsausbildung, aber dem Jugendlichen werden planmäßig berufliche Kenntnisse und Fertigkeiten vermittelt.

  **6. C – Arbeitnehmerähnliche Dienstleistung**

  Obwohl formal kein Arbeitsverhältnis besteht, entspricht die tatsächlich erbrachte Tätigkeit weitgehend der Arbeitsleistung eines Arbeitnehmers.

  **7. A – Berufsausbildung**

  Durch den Berufsausbildungsvertrag liegt eine reguläre Berufsausbildung vor.

  **8. B – Heimarbeiter**

  Die Jugendliche arbeitet in ihrer eigenen Arbeitsstätte zu Hause für einen Auftraggeber gegen Vergütung.

  **9. E – Keine der Kategorien**

  Die gelegentliche Mithilfe im eigenen Familienhaushalt ist keine Beschäftigung im Sinne dieser Vorschrift.

  **10. E – Keine der Kategorien** Der Auszubildende ist bereits 18 Jahre alt. Das Jugendarbeitsschutzgesetz gilt grundsätzlich nur für Personen, die noch nicht 18 Jahre alt sind.

solution_video:
tip: Achte nicht nur auf die Bezeichnung des Vertrags. Entscheidend ist vor allem, wie die Tätigkeit tatsächlich ausgeübt wird.

