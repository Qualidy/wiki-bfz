site_name: bfz – Informationen zur Zusammenarbeit
site_description: Kompakte Informationen und freiwillige Hilfen für selbstständige Dozenten.
site_url: https://qualidy.github.io/wiki-bfz/

nav:
  - Hauptseite: index.md
  - Zusammenarbeit und Unterlagen: content/1_welcome.md
  - Zugänge und Anmeldung: content/2_login.md
  - Kursrahmen und Teilnehmer: content/3_erklaerungen_ausbildung.md
  - Kursdurchführung und Nachweise: content/4_unterrichtsdurchfuehrung.md
  - Lernziele und Materialien: content/5_unterrichtsplanung.md
  - Technische Möglichkeiten: content/6_technische_hinweise.md
  - Didaktische Anregungen: content/7_didaktische_hinweise.md
  - Lernstand und Nachweise: content/8_lzk.md
  - Aufträge und Abrechnung: content/9_abschliessende_hinweise.md


theme:
  name: material
  language: de
  palette:
    primary: amber
    accent: indigo
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.keys
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums: true
  - pymdownx.tasklist:
      clickable_checkbox: true

extra_css:
  - stylesheets/logo.css
  - stylesheets/grid.css
  - stylesheets/python_tutor_admonition.css
  - stylesheets/mermaid.css

plugins:
    - search
    - macros

extra:
  social:
    - icon: fontawesome/solid/k
      link: https://www.kununu.com/de/qualidy
    - icon: fontawesome/brands/linkedin
      link: https://de.linkedin.com/company/qualidy
    - icon: material/google
      link: https://www.google.com/search?sca_esv=7e6ba2047fcb60f3&uds=AMwkrPtyB8MsmozA4Lwzqy2G2HCu-abqzc6moOG48q3gP5dtjTRzC2Ws0eSwcyLXDfZNuYCrZ7ByIreHLG9th3vKLekPoVeey0tumAbet4cVLQRLzdRFhUbOGbnyp3xo1V0hzzaNmkCN&si=AKbGX_rcuucMgom2rba1cdwsvM2SVoIkP2btyqGMV4t0GuHIs4sGV_1tpuqR0YHG4Rzd9SdJcL-lW6E-2aJA5azZLTKkIOrZ2j2aWwoBkVbdEJ0o0GPcQhs%3D&q=Qualidy+GmbH+Rezensionen&sa=X&ved=2ahUKEwibsbnSgcmFAxXNQvEDHaVYCiAQ3PALegQIRxAF
    - icon: fontawesome/solid/globe
      link: https://qualidy.de

watch:
  - tasks

copyright: Copyright &copy; 2026 Qualidy GmbH

